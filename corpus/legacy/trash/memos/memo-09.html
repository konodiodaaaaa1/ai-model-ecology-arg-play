        <div class="memo-date">11月3日 下午 14:50</div>
        <div class="memo-body">
          <p>今天去面试了。一家做企业软件的小公司。面试官问我的离职原因，我说"前一阶段的工作流程与我的认知架构产生了参数不对齐"。</p>
          <p>他愣了一下。我赶紧找补，说"就是不太合适的意思"。</p>
          <p>他说"你很适合做技术文档"。</p>
          <p>我没说我是面销售的。</p>
        </div>
      </div></article></main></body></html>
